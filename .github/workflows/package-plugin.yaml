name: Package and Sign Plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    # catalog-latest is the rolling release the generate-catalog job below
    # publishes to - publishing it fires this same release:published trigger
    # right back at us, and that tag doesn't match <plugin_name>-v<version>.
    if: github.event.release.tag_name != 'catalog-latest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tags are <plugin_name>-v<version>, e.g. qa_chunk-v0.0.13 ->
      # plugin_name=qa_chunk, version=0.0.13
      - name: Parse plugin name and version from tag
        id: parse
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
            echo "plugin_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' doesn't match <plugin_name>-v<version>" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Locate plugin directory
        id: locate
        run: |
          PLUGIN_NAME="${{ steps.parse.outputs.plugin_name }}"
          DIR=$(find . -mindepth 2 -maxdepth 2 -type d -name "$PLUGIN_NAME" | head -1)
          if [ -z "$DIR" ]; then
            echo "No directory found for plugin '$PLUGIN_NAME'" >&2
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # Reuses the CLI binary arkady-plugin-daemon's own publish-cli.yaml
      # already builds and releases -- no need to build Go here at all.
      # `gh release download` (no tag) resolves via the "latest release" API,
      # which skips prereleases entirely -- fetch the newest release
      # (prerelease or not) explicitly instead.
      - name: Download arkady CLI
        env:
          GH_TOKEN: ${{ secrets.ARKADY_PLUGIN_DAEMON_PAT }}
        run: |
          ASSET_URL=$(gh api repos/reraaaaa/arkady-plugin-daemon/releases \
            --jq '.[0].assets[] | select(.name=="arkady-plugin-linux-amd64") | .url')
          gh api "$ASSET_URL" -H "Accept: application/octet-stream" > arkady-cli
          chmod +x arkady-cli

      - name: Package plugin
        id: package
        run: |
          PACKAGE_NAME="${{ steps.parse.outputs.plugin_name }}-${{ steps.parse.outputs.version }}.arkadypkg"
          ./arkady-cli plugin package "${{ steps.locate.outputs.dir }}" -o "$PACKAGE_NAME"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Sign plugin
        run: |
          umask 077
          printf '%s\n' "${{ secrets.ARKADY_PLUGIN_SIGNING_KEY }}" > "$RUNNER_TEMP/signing_key.pem"
          ./arkady-cli signature sign "${{ steps.package.outputs.package_name }}" \
            -p "$RUNNER_TEMP/signing_key.pem" \
            -c arkady
          rm -f "$RUNNER_TEMP/signing_key.pem"

      - name: Upload signed package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          SIGNED_NAME="${PACKAGE_NAME%.arkadypkg}.signed.arkadypkg"
          gh release upload "${{ github.event.release.tag_name }}" "$SIGNED_NAME" --clobber

  generate-catalog:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Generate catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_catalog.py

      - name: Publish catalog.json to the rolling catalog-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view catalog-latest >/dev/null 2>&1; then
            gh release create catalog-latest --title "Marketplace catalog" \
              --notes "Auto-generated by generate_catalog.py on every plugin release. Consumed by arkady-marketplace."
          fi
          gh release upload catalog-latest catalog.json --clobber

      # Best-effort: the marketplace service may not be deployed yet, or may
      # be temporarily down - don't fail the whole workflow over it, the TTL
      # cache in that service will pick up the new catalog on its own anyway.
      - name: Notify arkady-marketplace to refresh its cache
        if: ${{ vars.MARKETPLACE_REFRESH_URL != '' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST "${{ vars.MARKETPLACE_REFRESH_URL }}" \
            -H "x-refresh-secret: ${{ secrets.MARKETPLACE_REFRESH_SECRET }}"
