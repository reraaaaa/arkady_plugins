[project]
name = "arkady-anthropic"
version = "0.3.26"
description = "Anthropic model provider plugin"
readme = "README.md"
requires-python = ">=3.12"

# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    "anthropic>=0.120.0",
    "arkady-plugin>=0.10.3,<0.11.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
]
