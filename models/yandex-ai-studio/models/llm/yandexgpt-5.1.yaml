# Каталог моделей сверен Алексеем вручную в консоли aistudio.yandex.ru
# 2026-08-17 (офиц. доки блокируют капчей ботов, поэтому список не из
# автоматического парсинга). Pricing не подтверждён — заполнен нулями,
# уточнить в биллинге Yandex Cloud перед тем как полагаться на учёт стоимости.
model: yandexgpt-5.1
label:
  en_US: YandexGPT Pro 5.1
  ru_RU: YandexGPT Pro 5.1
model_type: llm
features:
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 4096
    min: 1
    max: 32768
  - name: response_format
    use_template: response_format
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: RUB
