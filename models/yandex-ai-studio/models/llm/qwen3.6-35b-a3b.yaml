model: qwen3.6-35b-a3b
label:
  en_US: Qwen3.6 35B
  ru_RU: Qwen3.6 35B
model_type: llm
features:
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
