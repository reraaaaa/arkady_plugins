# Каталог/pricing — см. yandexgpt-5.1.yaml (тот же источник и оговорки).
# vision подтверждена эмпирически 2026-08-17: прямой запрос с image_url
# (base64 PNG) через живой ключ дал реальный анализ картинки в
# reasoning_content/content ("Чёрный"), в отличие от остальных 8 моделей
# каталога — те либо честно отвечали "не вижу изображение", либо падали
# структурной ошибкой ("is not a multimodal model" у qwen3-235b-a22b-fp8).
# Доки на aistudio.yandex.ru блокируют капчей — источник истины тут
# только живой тест, не сайт/SDK-репозиторий (там тоже нет каталога).
model: qwen3.6-35b-a3b
label:
  en_US: Qwen3.6 35B
  ru_RU: Qwen3.6 35B
model_type: llm
features:
  - tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 4096
    min: 1
    max: 262144
  - name: response_format
    use_template: response_format
  - name: tool_choice
    label:
      en_US: Tool Choice
      ru_RU: Выбор инструмента (tool_choice)
    type: string
    required: false
    default: "auto"
    options:
      - "auto"
      - "required"
    help:
      en_US: >-
        "auto" lets the model decide whether to call a tool or answer in
        plain text — this model sometimes narrates the intended call as
        text ("[search_npa] query...") instead of a real tool_call.
        "required" forces an actual tool call on every agent turn, which
        also defeats prompts that ask the model to request clarification
        before searching.
      ru_RU: >-
        "auto" — модель сама решает, вызывать тул или просто ответить
        текстом; эта модель иногда вместо реального tool_call описывает
        намерение текстом ("[search_npa] запрос..."). "required"
        заставляет модель вызывать тул на каждом шаге агента — это же
        отключает промпты, которые просят сначала уточнить вопрос, не
        вызывая тул.
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: RUB
