    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 4096
    min: 1
    max: 262144
  - name: response_format
    use_template: response_format
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: RUB
