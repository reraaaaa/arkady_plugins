# Каталог/pricing — см. yandexgpt-5.1.yaml (тот же источник и оговорки).
model: aliceai-llm
label:
  en_US: Alice AI LLM
  ru_RU: Alice AI LLM
model_type: llm
features:
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 4096
    min: 1
    max: 131072
  - name: response_format
    use_template: response_format
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: RUB
