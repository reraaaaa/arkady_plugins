# Каталог/pricing — см. yandexgpt-5.1.yaml (тот же источник и оговорки).
model: deepseek-v4-flash
label:
  en_US: DeepSeek V4 Flash
  ru_RU: DeepSeek V4 Flash
model_type: llm
features:
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 4096
    min: 1
    max: 1048576
  - name: response_format
    use_template: response_format
pricing:
  input: '0'
  output: '0'
  unit: '0.000001'
  currency: RUB
