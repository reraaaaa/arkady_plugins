[project]
name = "arkady-intelion-cloud"
version = "0.1.0"
description = "Claude models via Intelion Cloud (Anthropic-compatible gateway)"
readme = "README.md"
requires-python = ">=3.12"

# Managed with uv; refresh the lockfile with `uv lock`.
dependencies = [
    "anthropic>=0.120.0",
    "arkady-plugin-sdk>=0.10.4",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = ["pyrefly>=1.0.0", "pytest>=9.0.3"]
