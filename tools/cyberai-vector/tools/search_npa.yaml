identity:
  name: "search_npa"
  author: "cyberai-vector"
  label:
    en_US: "Search NPA (RF regulations)"
description:
  human:
    en_US: "Поиск фрагментов нормативных правовых актов РФ в области информационной безопасности (гибридный поиск + реранк, коллекция npa)."
  llm: "Ищет по базе нормативных правовых актов РФ в области информационной безопасности (федеральные законы, приказы ФСТЭК/ФСБ, постановления Правительства и т.д.). Возвращает сырые фрагменты норм с точными цитатами (статья/пункт), статусом действия и метаданными (обязательность, домены ИБ, ранг акта). Используй для точечного поиска конкретной нормы или когда нужно самому сопоставить несколько фрагментов."
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: "Query"
    human_description:
      en_US: "Поисковый запрос на русском"
    llm_description: "Формулировка вопроса или темы на языке НПА (например: 'требования к защите ПДн при обработке в ИСПДн УЗ 3')."
    form: llm
  - name: top_k
    type: number
    required: false
    default: 6
    label:
      en_US: "Top K"
    human_description:
      en_US: "Сколько фрагментов вернуть (по умолчанию 6)"
    llm_description: "Количество результатов, обычно 3-8."
    form: llm
extra:
  python:
    source: tools/search_npa.py
