<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="mGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BD5"/>
      <stop offset="1" stop-color="#2B579A"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B579A"/>
      <stop offset="1" stop-color="#1E3A6F"/>
    </linearGradient>
  </defs>

  <!-- 3 层堆叠文档（背景） -->
  <g transform="translate(36 26) rotate(-3 28 39)">
    <rect x="0" y="0" width="56" height="78" rx="2" fill="#E8F0FA" stroke="#A0B8D8" stroke-width="1"/>
  </g>
  <g transform="translate(30 20)">
    <rect x="0" y="0" width="60" height="84" rx="2" fill="#F5F8FC" stroke="#A0B8D8" stroke-width="1"/>
  </g>

  <!-- 前层主文档（带折角） -->
  <g transform="translate(24 14)">
    <path d="M0 0 L60 0 L72 12 L72 96 L0 96 Z" fill="white" stroke="#5B9BD5" stroke-width="1.5"/>
    <path d="M60 0 L60 12 L72 12" fill="#D0D9E8" stroke="#5B9BD5" stroke-width="1"/>

    <!-- 左上：柱状图 + 上升箭头 -->
    <g transform="translate(8 8)">
      <rect x="0" y="10" width="3" height="8" fill="#5B9BD5"/>
      <rect x="5" y="6" width="3" height="12" fill="#5B9BD5"/>
      <rect x="10" y="2" width="3" height="16" fill="#2B579A"/>
      <path d="M0 8 L6 4 L12 0 L17 0" stroke="#2B579A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M14 -2 L17 0 L15 3" stroke="#2B579A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 右上：文本行 -->
    <g transform="translate(30 8)">
      <rect x="0" y="0" width="32" height="1.5" rx="0.75" fill="#5B9BD5" opacity="0.5"/>
      <rect x="0" y="5" width="28" height="1.5" rx="0.75" fill="#5B9BD5" opacity="0.5"/>
      <rect x="0" y="10" width="32" height="1.5" rx="0.75" fill="#5B9BD5" opacity="0.5"/>
      <rect x="0" y="15" width="24" height="1.5" rx="0.75" fill="#5B9BD5" opacity="0.5"/>
    </g>

    <!-- 底部：References -->
    <g transform="translate(8 78)">
      <rect x="0" y="0" width="20" height="1.5" rx="0.75" fill="#5B9BD5" opacity="0.5"/>
      <rect x="0" y="3" width="16" height="1.5" rx="0.75" fill="#5B9BD5" opacity="0.5"/>
      <text x="0" y="10" fill="#5B9BD5" font-size="5" font-family="Arial, sans-serif" font-weight="700">References</text>
    </g>

  </g>

  <!-- 左侧 M 徽章 -->
  <g transform="translate(0 40)">
    <path d="M0 0 L36 0 L36 48 L18 56 L0 48 Z" fill="url(#mGrad)" stroke="white" stroke-width="2"/>
    <text x="18" y="33" text-anchor="middle" fill="white" font-size="24" font-family="Arial, sans-serif" font-weight="900">M</text>
  </g>

  <!-- 右侧 X 徽章 -->
  <g transform="translate(87 40)">
    <path d="M0 0 L36 0 L36 48 L18 56 L0 48 Z" fill="url(#wGrad)" stroke="white" stroke-width="2"/>
    <rect x="8" y="8" width="20" height="28" rx="1.5" fill="white"/>
    <text x="18" y="25" text-anchor="middle" fill="#2B579A" font-size="16" font-family="Arial, sans-serif" font-weight="900">X</text>
    <rect x="11" y="30" width="14" height="0.8" fill="#2B579A" opacity="0.5"/>
    <rect x="11" y="32.5" width="10" height="0.8" fill="#2B579A" opacity="0.5"/>
  </g>

  <!-- DOC（最上层，绝对坐标，基线=68+5=73 对齐 M=40+33=73） -->
  <g transform="translate(50 68)">
    <text x="-13" y="8" text-anchor="start" fill="#5B9BD5" opacity="0.6" font-size="22" font-family="Arial, sans-serif" font-weight="900">D</text>
    <text x="-15" y="5" text-anchor="start" fill="none" stroke="#2B579A" stroke-width="1.2" font-size="22" font-family="Arial, sans-serif" font-weight="900">D</text>
    <text x="3" y="5" text-anchor="start" fill="#2B579A" font-size="22" font-family="Arial, sans-serif" font-weight="900">O</text>
    <text x="20" y="5" text-anchor="start" fill="#2B579A" font-size="22" font-family="Arial, sans-serif" font-weight="900">C</text>
  </g>
</svg>
