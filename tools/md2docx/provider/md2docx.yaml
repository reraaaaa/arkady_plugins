# Provider identity mirrors the manifest for consistency in Dify's tool selector
# and the marketplace listing. Label/description here take precedence when both
# manifest.yaml and this file declare the same field.
identity:
  author: "arkady"
  name: "md2docx"
  icon: "icon.svg"
  label:
    en_US: "md2docx"
    zh_Hans: "md2docx"
  description:
    en_US: "Convert Markdown to polished DOCX with templates, Mermaid, and style presets."
    zh_Hans: "将 Markdown 转换为精美 DOCX，支持模板、Mermaid 和样式预设。"
  tags:
    - "utilities"
    - "productivity"

tools:
  - "tools/md_to_docx.yaml"
  - "tools/md_to_docx_advanced.yaml"
  - "tools/mermaid_converter.yaml"

extra:
  python:
    source: "provider/md2docx.py"
