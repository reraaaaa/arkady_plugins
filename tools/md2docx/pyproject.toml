[project]
name = "arkady-md2docx"
version = "0.0.7"
description = "Markdown to DOCX conversion tool (Pandoc-based, pluggable reference-doc style templates)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "arkady-plugin-sdk>=0.10.4",
    "pypandoc-binary>=1.12",
    "python-docx>=1.1.0,<2.0",
    "requests>=2.31.0,<3.0",
    "lxml>=5.0.0,<6.0",
]

# uv run black . -C -l 100 && uv run ruff check --fix
[dependency-groups]
dev = []
